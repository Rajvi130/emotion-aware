
<!DOCTYPE html>
<html>
<head>
  <title>Detection</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- CSS -->
<link rel="stylesheet" href="css/style.css">

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- Face API -->
<script defer src="https://cdn.jsdelivr.net/npm/face-api.js"></script>
</head>
<body>
    <div class="container">
  <!-- your dashboard code -->
</div>

<div class="navbar">
  <div class="logo">Emotion AI</div>

  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="dashboard.html">Dashboard</a></li>
    <li><a href="detection.html">Detect</a></li>
  </ul>

  <button class="toggle-btn" onclick="toggleDarkMode()">🌙</button>
</div>
<div class="container">
    

  <h1 class="title">🧠 Emotion AI Dashboard</h1>


<canvas id="emotionChart" style="max-width:600px; margin:20px auto;"></canvas>
  <!-- GRID LAYOUT -->
  <div class="grid">

    <!-- FACE CARD -->
    <div class="card glass">
      <h3>📷 Facial Analysis</h3>
      <video id="video" autoplay></video>

      <div class="btn-group">
        <button onclick="startCamera()">Start</button>
        <button onclick="detectFaceEmotion()">Analyze</button>
      </div>

      <p id="faceEmotion">--</p>
    </div>

    <!-- VOICE CARD -->
    <div class="card glass">
      <h3>🎤 Voice Analysis</h3>

      <button onclick="startMic()">Speak</button>

      <p id="speechText">--</p>
      <p id="voiceEmotion">--</p>
    </div>

    <!-- FINAL CARD -->
    <div class="card glass highlight">
      <h3>🧠 Final Emotion</h3>
      <h2 id="finalEmotion">--</h2>
    </div>

  </div>

  <!-- EMOTION VISUAL -->
  <div class="card glass">
    <h3>📊 Emotion Breakdown</h3>

    <div class="bar">
      <span>Happy 😊</span>
      <div class="progress"><div id="happyBar"></div></div>
    </div>

    <div class="bar">
      <span>Sad 😢</span>
      <div class="progress"><div id="sadBar"></div></div>
    </div>

    <div class="bar">
      <span>Angry 😡</span>
      <div class="progress"><div id="angryBar"></div></div>
    </div>

    <div class="bar">
      <span>Neutral 😐</span>
      <div class="progress"><div id="neutralBar"></div></div>
    </div>

  </div>

</div>
<script src="js/app.js"></script>
<script src="js/webcam.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
